<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --accent: #007aff;                      /* Apple blue */
      --text: #1d1d1f;
      --muted: #6e6e73;
      --glass: rgba(255, 255, 255, 0.55);     /* see-through white */
      --glass-border: rgba(255, 255, 255, 0.7);
    }
    * { box-sizing: border-box; }

    /* Background: soft color blobs for the glass to blur */
    body {
      width: 320px; margin: 0; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, #c9e4ff 0%, transparent 45%),
        radial-gradient(circle at 90% 30%, #f6d6ff 0%, transparent 45%),
        radial-gradient(circle at 40% 100%, #d4fff1 0%, transparent 50%),
        #f5f5f7;
    }
    h3 { margin: 0 0 12px; font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }

    /* Glass panels */
    .modes, #promptFields {
      background: var(--glass);
      backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    /* Mode switch as an Apple-style segmented control */
    .modes { display: flex; padding: 3px; }
    .modes label {
      flex: 1; margin: 0; padding: 6px 0; text-align: center;
      border-radius: 11px; font-size: 13px; color: var(--muted);
      cursor: pointer; transition: all 0.2s;
    }
    .modes input { display: none; }
    .modes label:has(input:checked) {
      background: #fff; color: var(--text); font-weight: 500;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }

    /* Fields */
    #promptFields { margin-top: 12px; padding: 4px 12px 12px; }
    #promptFields label { display: block; margin-top: 10px; font-size: 12px; color: var(--muted); }
    textarea, select {
      width: 100%; margin-top: 4px; padding: 8px 10px;
      font: inherit; font-size: 13px; color: var(--text);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 10px; outline: none;
    }
    textarea { height: 64px; resize: vertical; }
    textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
    }

    /* Main button */
    button {
      width: 100%; margin-top: 14px; padding: 11px;
      border: none; border-radius: 12px;
      background: var(--accent); color: #fff;
      font: inherit; font-size: 15px; font-weight: 500;
      cursor: pointer; transition: transform 0.1s, background 0.2s;
    }
    button:hover { background: #0068d9; }
    button:active { transform: scale(0.98); }   /* small "press" feel */

    #status { margin-top: 8px; min-height: 16px; font-size: 12px; color: var(--muted); text-align: center; }
    p { margin: 6px 0 0; text-align: center; }
    a { color: var(--accent); text-decoration: none; font-size: 12px; }
  </style>
</head>
<body>
  <h3>Bobbinly</h3>

  <div class="modes">
    <label><input type="radio" name="mode" value="plain" checked> Plain thread</label>
    <label><input type="radio" name="mode" value="prompt"> AI prompt</label>
  </div>

  <div id="promptFields">
    <label>My idea for the reply
      <textarea id="idea" placeholder="e.g. Say yes, but ask to move it to Friday"></textarea>
    </label>
    <label>Recipient is my
      <select id="relationship">
        <option>Boss / manager</option>
        <option>Professor</option>
        <option>Client</option>
        <option>Coworker</option>
        <option>Friend</option>
        <option>Other</option>
      </select>
    </label>
    <label>Tone
      <select id="tone">
        <option>Professional</option>
        <option>Friendly</option>
        <option>Firm</option>
        <option>Apologetic</option>
      </select>
    </label>
    <label>Length
      <select id="length">
        <option>Short</option>
        <option>Medium</option>
        <option>Long</option>
      </select>
    </label>
  </div>

  <button id="copyBtn">Copy thread</button>
  <div id="status"></div>
  <p style="font-size:12px"><a href="#" id="spoolLink">Edit Your Spool</a></p>
  <script src="popup.js"></script>
</body>
</html>
